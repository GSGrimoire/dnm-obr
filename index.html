<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D&amp;M Rolls and Actions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Exo+2:wght@400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <section class="pools">
    <div class="pool">
      <span class="pool-label">Momentum</span>
      <div class="pool-controls">
        <button class="step" data-pool="momentum" data-delta="-1" aria-label="Spend momentum">&minus;</button>
        <span class="pool-value" id="momentum-value">0</span>
        <button class="step" data-pool="momentum" data-delta="1" aria-label="Gain momentum">+</button>
      </div>
    </div>
    <div class="pool threat">
      <span class="pool-label">Threat</span>
      <div class="pool-controls">
        <button class="step" data-pool="threat" data-delta="-1" aria-label="Spend threat">&minus;</button>
        <span class="pool-value" id="threat-value">0</span>
        <button class="step" data-pool="threat" data-delta="1" aria-label="Add threat">+</button>
      </div>
    </div>
  </section>

  <section class="roller">
    <div id="char-banner" class="char-banner" hidden></div>
    <div class="grid-2">
      <label>Character
        <input type="text" id="char-name" placeholder="Name" maxlength="24">
      </label>
      <label>Testing
        <input type="text" id="roll-label" placeholder="optional" maxlength="40">
      </label>
    </div>

    <div class="stat-row">
      <label class="stat-pick">Attribute
        <select id="attr-key">
          <option value="might">Might</option>
          <option value="quickness">Quickness</option>
          <option value="insight">Insight</option>
          <option value="resolve">Resolve</option>
        </select>
      </label>
      <label class="stat-val">Value
        <input type="number" id="attr-val" min="0" max="20" value="9">
      </label>
    </div>

    <div class="stat-row">
      <label class="stat-pick">Skill
        <select id="skill-key">
          <option value="fight">Fight</option>
          <option value="move">Move</option>
          <option value="operate">Operate</option>
          <option value="sneak">Sneak</option>
          <option value="study">Study</option>
          <option value="survive">Survive</option>
          <option value="talk">Talk</option>
        </select>
      </label>
      <label class="stat-val">Value
        <input type="number" id="skill-val" min="0" max="20" value="2">
      </label>
    </div>

    <p class="rule-hint" id="rule-hint"></p>

    <div class="grid-2">
      <label>d20s
        <div class="segmented" id="dice-seg">
          <button data-dice="1">1</button>
          <button data-dice="2" class="on">2</button>
          <button data-dice="3">3</button>
          <button data-dice="4">4</button>
          <button data-dice="5">5</button>
        </div>
      </label>
      <label>Difficulty
        <div class="segmented" id="diff-seg">
          <button data-diff="0">0</button>
          <button data-diff="1" class="on">1</button>
          <button data-diff="2">2</button>
          <button data-diff="3">3</button>
          <button data-diff="4">4</button>
          <button data-diff="5">5</button>
        </div>
      </label>
    </div>

    <div class="roll-row">
      <label class="hidden-toggle" id="hidden-wrap" hidden>
        <input type="checkbox" id="hidden-roll">
        <span>Hidden</span>
      </label>
      <button id="roll-btn" class="primary">Roll</button>
    </div>
  </section>

  <!-- GM only. Hidden entirely for players by roller.js, not merely disabled: these
       push a boundary to every character at the table, and it should not look like
       something a player might be allowed to press. -->
  <section id="gm-panel" class="gm-panel" hidden>
    <div class="gm-panel-head">
      <h2>Table Controls</h2>
      <span class="gm-badge">GM</span>
    </div>
    <div class="gm-group">
      <span class="gm-group-label">Rest</span>
      <div class="gm-buttons">
        <button class="gm-btn" data-epoch="breather">Breather</button>
        <button class="gm-btn" data-epoch="break">Break</button>
        <button class="gm-btn" data-epoch="bed">Bed</button>
      </div>
    </div>
    <div class="gm-group">
      <span class="gm-group-label">Boundary</span>
      <div class="gm-buttons">
        <button class="gm-btn" data-epoch="scene">End Scene</button>
        <button class="gm-btn" data-epoch="session">New Session</button>
        <button class="gm-btn" data-epoch="adventure">New Adventure</button>
      </div>
    </div>
    <p class="gm-note">Applies to every attached character. A sheet that is closed
      catches up the next time it is opened.</p>
  </section>

  <section class="log-section">
    <div class="log-header">
      <h2>Rolls and Actions</h2>
      <button id="clear-log" class="ghost" hidden>Clear</button>
    </div>
    <ol id="log" class="log"></ol>
  </section>

  <p id="status" class="status"></p>
</div>

<script type="module" src="roller.js"></script>
</body>
</html>
