<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D&amp;M Character Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Exo+2:wght@400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="sheet.css">
</head>
<!--
  The body of the sheet is built by sheet.js rather than declared here.
  v0.5 kept the section skeleton in markup and the renderers in script, and the
  two drifted: sheet.js wrote to an element the markup no longer had, which threw
  and silently killed every section below it. One source of truth removes that
  failure mode — a renderer that targets a container it creates cannot miss.
-->
<body class="sheet-body">

<div id="import-view" hidden>
  <div class="import-card">
    <h1>Attach a character</h1>
    <p>Paste a character code exported from the Dreams &amp; Machines character creator, version 1.11 or newer. Version 1.13 or newer fills in the whole sheet.</p>
    <textarea id="code-input" rows="6" placeholder="DM1-..." spellcheck="false"></textarea>
    <p class="err" id="import-error"></p>
    <div class="row-end">
      <button id="cancel-import" class="ghost">Close</button>
      <button id="do-import" class="primary">Attach</button>
    </div>
  </div>
</div>

<div id="sheet-view" hidden>

  <header class="sheet-head">
    <img id="portrait" alt="" hidden>
    <div class="ident">
      <h1 id="char-name">&mdash;</h1>
      <div id="ident-chips" class="chips"></div>
    </div>
    <div class="head-actions">
      <button id="copy-code" class="ghost">Copy code</button>
      <button id="detach" class="ghost danger">Detach</button>
      <button id="close-sheet" class="primary">Close</button>
    </div>
  </header>

  <div class="sheet-scroll"><div id="sheet-body"></div></div>

  <footer class="test-bar">
    <div class="test-pick">
      <span class="test-label">Test</span>
      <strong id="pick-attr">pick an attribute</strong>
      <span class="sep">+</span>
      <strong id="pick-skill">pick a skill</strong>
    </div>
    <label class="inline">d20s
      <div class="segmented" id="dice-seg">
        <button data-dice="1">1</button>
        <button data-dice="2" class="on">2</button>
        <button data-dice="3">3</button>
        <button data-dice="4">4</button>
        <button data-dice="5">5</button>
      </div>
    </label>
    <label class="inline">Difficulty
      <div class="segmented" id="diff-seg">
        <button data-diff="0">0</button>
        <button data-diff="1" class="on">1</button>
        <button data-diff="2">2</button>
        <button data-diff="3">3</button>
        <button data-diff="4">4</button>
        <button data-diff="5">5</button>
      </div>
    </label>
    <span id="spirit-cost" class="spirit-cost"></span>
    <button id="sheet-roll" class="primary" disabled>Roll</button>
  </footer>

  <p id="sheet-status" class="status"></p>
</div>

<script type="module" src="sheet.js"></script>
</body>
</html>
